# Entorno local de desarrollo.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: ozin-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ozin}
      POSTGRES_USER: ${DB_USERNAME:-ozin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ozin}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ozin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ozin} -d ${DB_NAME:-ozin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ozin-pgdata:
