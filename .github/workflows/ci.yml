name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 · Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compilación + tests unitarios + ArchUnit + integración (Testcontainers) + reporte JaCoCo
      - name: Build y tests
        run: ./mvnw -B verify
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/**/target/site/jacoco/

  frontend:
    name: Frontend (Angular · PrimeNG)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Licencias de las dependencias
        run: npm run check:licenses
      - name: Tests
        run: npm run test:ci
      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      OZIN_JWT_SECRET: solo-para-ci-no-es-un-secreto-real-0123456789
      OZIN_ADMIN_EMAIL: admin@ozin.test
      OZIN_ADMIN_PASSWORD: Verificacion123
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ozin
          POSTGRES_USER: ozin
          POSTGRES_PASSWORD: ozin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ozin -d ozin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Arrancar el backend
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar ozin-bootstrap/target/ozin-api.jar > backend.log 2>&1 &
          timeout 120 bash -c 'until curl -sf localhost:8080/actuator/health > /dev/null; do sleep 2; done'
      - name: Instalar frontend y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Recorridos E2E
        working-directory: frontend
        run: npm run e2e
      - name: Publicar evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            frontend/test-results/
            backend/backend.log
