spring:
  application:
    name: ozin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ozin}
    username: ${DB_USERNAME:ozin}
    password: ${DB_PASSWORD:ozin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # El esquema lo gestiona Flyway, nunca Hibernate (ADR-0003)
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50   # Evita el problema N+1 al cargar colecciones de estilistas
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ozin:
  security:
    jwt-secret: ${OZIN_JWT_SECRET}                # Obligatorio y sin valor por defecto, a propósito
    issuer: ozin-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    bcrypt-strength: 12
    max-failed-logins: 5
    failed-login-window: 15m
    allowed-origins: ${OZIN_ALLOWED_ORIGINS:http://localhost:4200}
    admin-email: ${OZIN_ADMIN_EMAIL:}
    admin-password: ${OZIN_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
